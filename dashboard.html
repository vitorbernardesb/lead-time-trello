  // ─── SNAPSHOT ───────────────────────────────────
  function saveSnapshotIfNeeded(kpis, config) {
    var now = new Date();
    var key = 'snapshot_'+now.getFullYear()+'_'+String(now.getMonth()+1).padStart(2,'0');
    t.get('board', 'shared', key).then(function(existing) {
      if (!existing) {
        var snap = {
          score: kpis.healthScore,
          kpi1: kpis.kpi1, kpi2: kpis.kpi2, kpi3: kpis.kpi3, kpi4: kpis.kpi4, kpi5: kpis.kpi5, kpi6: kpis.kpi6,
          meta_prazo: config.meta_prazo, meta_rework: config.meta_rework,
          meta_leadtime: config.meta_leadtime, meta_leadtime_real: config.meta_leadtime_real,
          meta_through: config.meta_through,
          meta_conformidade: config.meta_conformidade,
          totalCards: kpis.totalCards,
          savedAt: now.toISOString()
        };
        return t.set('board', 'shared', key, snap);
      }
    }).catch(function(err) {
      console.warn('[SNAPSHOT] Falha ao salvar snapshot mensal:', err && err.message ? err.message : String(err));
    });
  }

  function forceSnapshot(kpis, config) {
    var now = new Date();
    var key = 'snapshot_'+now.getFullYear()+'_'+String(now.getMonth()+1).padStart(2,'0');
    var snap = {
      score: kpis.healthScore,
      kpi1: kpis.kpi1, kpi2: kpis.kpi2, kpi3: kpis.kpi3, kpi4: kpis.kpi4, kpi5: kpis.kpi5, kpi6: kpis.kpi6,
      meta_prazo: config.meta_prazo, meta_rework: config.meta_rework,
      meta_leadtime: config.meta_leadtime, meta_leadtime_real: config.meta_leadtime_real,
      meta_through: config.meta_through,
      meta_conformidade: config.meta_conformidade,
      totalCards: kpis.totalCards,
      savedAt: now.toISOString()
    };
    return t.set('board', 'shared', key, snap);
  }

  // ─── SNAPSHOT SEMANAL ───────────────────────────
  // 4 dos KPIs "fotografia do momento" (vencidos, retrabalho, conformidade, health) não
  // são reconstruíveis no passado — por isso passamos a REGISTRÁ-LOS por semana daqui
  // pra frente. Aging (kpi3) também é gravado aqui (mesmo tile/delta mês a mês), mas seu
  // drill-down usa a timeline dos cards (ver HIST_DERIVAVEL) em vez desse registro.
  // Guardados num ÚNICO objeto (não uma chave por semana),
  // podado às últimas WEEKLY_KEEP semanas: evita explodir o storage do Power-Up e
  // mantém a leitura barata (o t.get('board','shared') do Histórico já traz tudo).
  var WEEKLY_KEY = 'weeklySnaps';
  var WEEKLY_KEEP = 26;

  // Semana ISO (segunda a domingo) — a mesma convenção de semana usada nos gráficos.
  function isoWeekOf(d) {
    var dt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var dow = (dt.getDay() + 6) % 7;          // 0 = segunda
    dt.setDate(dt.getDate() - dow + 3);       // quinta-feira da semana ISO
    var firstThu = new Date(dt.getFullYear(), 0, 4);
    var fdow = (firstThu.getDay() + 6) % 7;
    firstThu.setDate(firstThu.getDate() - fdow + 3);
    return { year: dt.getFullYear(), week: 1 + Math.round((dt - firstThu) / 604800000) };
  }
  function weekKeyOf(d) {
    var w = isoWeekOf(d);
    return w.year + '_W' + String(w.week).padStart(2, '0');
  }
  // Segunda-feira da semana de `d` (mesma regra do gráfico de evolução das Análises).
  function weekStartOf(d) {
    var x = new Date(d); x.setHours(0, 0, 0, 0);
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  function weekLabel(d) { return fmtDateBR(d).slice(0, 5); }   // dd/mm

  // Formato compartilhado pelo snapshot semanal E diário (mesmos campos).
  function snapPayload(kpis, now) {
    return {
      score: kpis.healthScore,
      kpi1: kpis.kpi1, kpi2: kpis.kpi2, kpi3: kpis.kpi3,
      kpi4: kpis.kpi4, kpi5: kpis.kpi5, kpi6: kpis.kpi6,
      totalCards: kpis.totalCards,
      savedAt: now.toISOString()
    };
  }
  function pruneWeekly(map) {
    var keys = Object.keys(map).sort();                  // "YYYY_Www" ordena cronologicamente
    while (keys.length > WEEKLY_KEEP) { delete map[keys.shift()]; }
    return map;
  }
  // Grava a semana corrente se ainda não existir (idempotente). `force` sobrescreve.
  function saveWeeklySnapshot(kpis, force) {
    var now = new Date();
    var wk = weekKeyOf(now);
    return t.get('board', 'shared', WEEKLY_KEY).then(function(map) {
      map = (map && typeof map === 'object') ? map : {};
      if (!force && map[wk]) return;                     // semana já registrada
      map[wk] = snapPayload(kpis, now);
      return t.set('board', 'shared', WEEKLY_KEY, pruneWeekly(map));
    }).catch(function(err) {
      console.warn('[SNAPSHOT] Falha ao salvar snapshot semanal:', err && err.message ? err.message : String(err));
    });
  }

  // ─── SNAPSHOT DIÁRIO ────────────────────────────
  // Mesmo mecanismo do semanal, só que por dia — é o que dá granularidade DIÁRIA aos
  // indicadores "fotografia do momento" no drill-down do Histórico (antes só existia
  // semanal para eles, então o toggle "Diário" caía numa lista de snapshots mensais
  // esparsos e o gráfico saía quase reto). Podado às últimas DAILY_KEEP entradas.
  //
  // Formato COMPACTO (array de números, não objeto com nomes de campo repetidos): o
  // Power-Up do Trello limita cada chave a ~4096 caracteres. No formato do snapshot
  // semanal (objeto), 60 dias passaria bem desse limite; em array fica ~45 char/dia —
  // 60 dias cabem com folga (~2,7 mil caracteres). Ver DAILY_FIELDS p/ o índice de cada KPI.
  var DAILY_KEY = 'dailySnaps';
  var DAILY_KEEP = 60; // ~2 meses de granularidade diária
  var DAILY_FIELDS = ['score', 'kpi1', 'kpi2', 'kpi3', 'kpi4', 'kpi5', 'kpi6', 'totalCards'];

  function dayKeyOf(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function pruneDaily(map) {
    var keys = Object.keys(map).sort();                  // "YYYY-MM-DD" ordena cronologicamente
    while (keys.length > DAILY_KEEP) { delete map[keys.shift()]; }
    return map;
  }
  // Grava o dia corrente se ainda não existir (idempotente). `force` sobrescreve.
  function saveDailySnapshot(kpis, force) {
    var now = new Date();
    var dk = dayKeyOf(now);
    return t.get('board', 'shared', DAILY_KEY).then(function(map) {
      map = (map && typeof map === 'object') ? map : {};
      if (!force && map[dk]) return;                      // dia já registrado
      map[dk] = DAILY_FIELDS.map(function(f) { return kpis[f === 'score' ? 'healthScore' : f]; });
      return t.set('board', 'shared', DAILY_KEY, pruneDaily(map));
    }).catch(function(err) {
      console.warn('[SNAPSHOT] Falha ao salvar snapshot diário:', err && err.message ? err.message : String(err));
    });
  }

  // ─── LOAD REALTIME ──────────────────────────────
  function loadRealtime(forceRefresh) {
    document.getElementById('rt-content').style.display = 'none';
    document.getElementById('rt-error').style.display = 'none';
    resetRenderedTabs();

    var token = TRELLO_TOKEN, boardId, config;
    t.board('id')
      .then(function(board) { boardId = board.id; return t.get('board', 'shared', 'healthConfig'); })
      .then(function(cfg) {
        config = mergeConfig(cfg);

        if (!forceRefresh) {
          var cache = readCache(boardId);
          if (cache && cache.cards) {
            setCachedData({ cards: cache.cards, config: config, throughput: cache.throughput, archived: cache.archived || [] });
            var kpis = calcKPIs(cache.cards, config);
            var slaAlerts = computeSLAAlerts(cache.cards, config);
            renderRealtime(kpis, config, cache.cards, cache.cachedAt, cache.archived || []);
            renderAlertBanner(slaAlerts);
            document.getElementById('rt-loading').style.display = 'none';
            return;
          }
        }

        showSkeleton('Buscando cards do board…');
        return fetchData(token, boardId).then(function(data) {
          setCachedData({ cards: data.cards, config: config, throughput: data.throughput, archived: data.archived || [] });
          writeCache(boardId, { cards: data.cards, throughput: data.throughput, archived: data.archived || [] });
          var kpis = calcKPIs(data.cards, config);
          var slaAlerts = computeSLAAlerts(data.cards, config);
          renderRealtime(kpis, config, data.cards, null, data.archived || []);
          renderAlertBanner(slaAlerts);
          saveSnapshotIfNeeded(kpis, config);
          saveWeeklySnapshot(kpis, false);   // registra a semana corrente (1x por semana)
          saveDailySnapshot(kpis, false);    // registra o dia corrente (1x por dia)
        });
      })
      .catch(function(err) {
        document.getElementById('rt-loading').style.display = 'none';
        var errEl = document.getElementById('rt-error');
        errEl.style.display = '';
        errEl.querySelector('p').textContent = 'Erro ao carregar dados: '+(err.message||String(err));
      });
  }

  document.getElementById('rt-retry').addEventListener('click', function() { loadRealtime(); });

  // ─── HISTORY: CARDS DE TENDÊNCIA ────────────────
  // Derivado 100% dos snapshots JÁ lidos por loadHistory (t.get 'board','shared') —
  // nenhuma consulta nova ao Trello, nenhum KPI recalculado: apenas lê os agregados
  // já persistidos e faz a diferença vs. o snapshot anterior.
  // `tipo` segue a MESMA convenção de buildKpiCards/kpiHealth:
  //   'A' = quanto maior melhor · 'B' = quanto menor melhor.
  var HIST_METRICS = [
    { key: 'score', name: 'Health Score',      tipo: 'A', unit: '',       du: ''     },
    { key: 'kpi1',  name: 'Cards vencidos',    tipo: 'B', unit: '%',      du: ' pp'  },
    { key: 'kpi2',  name: 'Retrabalhos',       tipo: 'B', unit: '',       du: ''     },
    { key: 'kpi6',  name: 'Tempo de entrega',  tipo: 'B', unit: ' d.u.',  du: ' d.u.'},
    { key: 'kpi3',  name: 'Tempo na etapa',    tipo: 'B', unit: ' d.u.',  du: ' d.u.'},
    { key: 'kpi4',  name: 'Vazão mensal',      tipo: 'A', unit: '',       du: ''     },
    { key: 'kpi5',  name: 'Conformidade',      tipo: 'A', unit: '%',      du: ' pp'  }
  ];
  var HIST_COR = { good: '#1E7A46', bad: '#B3272F', neutral: '#75757F' };

  function histNum(v) { return String(round1(v)).replace('.', ','); }
  function histHas(v) { return v !== undefined && v !== null && !isNaN(v); }

  // Sparkline (linha + área) — SVG inline, sem eixos nem libs. Estica na horizontal
  // (preserveAspectRatio="none") e mantém a espessura do traço via vector-effect.
  function histSpark(values, cor) {
    if (!values || values.length < 2) return '';
    var W = 120, H = 26, pad = 2;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var span = max - min;
    var n = values.length;
    function px(i) { return pad + (i / (n - 1)) * (W - pad * 2); }
    function py(v) { return span > 0 ? (H - pad) - ((v - min) / span) * (H - pad * 2) : H / 2; }
    var d = '';
    values.forEach(function(v, i) { d += (i ? 'L' : 'M') + px(i).toFixed(1) + ' ' + py(v).toFixed(1) + ' '; });
    var area = 'M' + px(0).toFixed(1) + ' ' + H + ' ' + d.replace('M', 'L') + 'L' + px(n - 1).toFixed(1) + ' ' + H + ' Z';
    return '<svg class="hist-spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true" focusable="false">' +
      '<path d="' + area + '" fill="' + cor + '" opacity="0.10"/>' +
      '<path d="' + d + '" fill="none" stroke="' + cor + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
      '</svg>';
  }

  // ── SÉRIES SEMANAIS E DIÁRIAS ────────────────────
  // Dois regimes, por natureza do indicador — mas AMBOS têm versão diária hoje:
  //  • DERIVADO (retroativo): kpi4/Vazão e kpi6/Tempo de entrega saem dos próprios cards
  //    (concludedAt + leadTimeReal) — timestamp fixo no passado, então dá pra reconstruir
  //    série diária/semanal para qualquer período já coberto pelos cards em cache,
  //    inclusive ANTES de a coleta de snapshots ter começado. kpi3/Tempo na etapa entrou
  //    nesse grupo: a timeline completa de cada card (c.stages) já sai do processamento
  //    de "Tempo real", então dá pra reconstruir em que etapa (e há quanto tempo) o card
  //    estava em qualquer data passada — ver stageAsOf/kpi3AsOf.
  //  • REGISTRADO: os demais (score, kpi1/vencidos, kpi2/retrabalho, kpi5/conformidade)
  //    são "fotografia do momento" (estado do board AGORA, ex: due date vencida hoje,
  //    valor atual de um campo customizado) — genuinamente não reconstruíveis no
  //    passado, porque nada no board guarda o que esses valores eram numa data que já
  //    passou. Ficam registrados dia a dia (dailySnaps) e semana a semana (weeklySnaps)
  //    a partir de agora, então a série diária cresce sozinha a cada acesso ao dashboard
  //    (ver histDailyRecorded/histWeeklyRecorded).
  var HIST_DERIVAVEL = { kpi3: true, kpi4: true, kpi6: true };

  // Reconstrói em que etapa (stage) um card estava numa data específica, a partir da
  // timeline completa armazenada em c.stages (etapa a etapa, na ordem em que ocorreram).
  // Retorna null se o card ainda não existia naquela data.
  function stageAsOf(stages, asOfTime) {
    if (!Array.isArray(stages)) return null;
    for (var i = 0; i < stages.length; i++) {
      var entered = new Date(stages[i].enteredAt).getTime();
      if (entered > asOfTime) break; // etapas seguintes ainda nem tinham começado
      var left = stages[i].leftAt ? new Date(stages[i].leftAt).getTime() : null;
      if (left === null || left > asOfTime) return stages[i]; // era essa a etapa em asOfTime
    }
    return null;
  }

  // kpi3 (Tempo na etapa) "as of" uma data: média de dias úteis que os cards então em
  // produção ativa já estavam na etapa em que se encontravam naquele momento — mesmo
  // princípio do cálculo atual (calcKPIs), só que aplicado a uma data passada em vez
  // de "agora". null quando nenhum card estava em produção ativa na data.
  function kpi3AsOf(cards, asOf) {
    var t = asOf.getTime();
    var totalDays = 0, matched = [];
    (cards || []).forEach(function(c) {
      var st = stageAsOf(c.stages, t);
      if (!st || PRODUCAO_ATIVA.indexOf(st.name) === -1) return;
      totalDays += countBusinessDays(new Date(st.enteredAt), asOf);
      matched.push(c);
    });
    if (!matched.length) return null;
    return { value: round1(totalDays / matched.length), n: matched.length, cards: matched };
  }

  // Série semanal/diária de kpi3 — um ponto "as of" fim-de-semana/fim-de-dia por
  // posição (nunca projeta além de hoje). Não plota pontos sem card em produção ativa
  // naquele momento (seria inventar um "0 d.u." que não existiu).
  function histWeeklyKpi3(cards, start, end) {
    var startWeek = weekStartOf(start).getTime(), endWeek = weekStartOf(end).getTime(), WEEK = 604800000;
    var today = new Date();
    var pts = [];
    for (var k = startWeek; k <= endWeek; k += WEEK) {
      var weekEnd = new Date(k + WEEK - 1);
      if (weekEnd > today) weekEnd = today;
      var agg = kpi3AsOf(cards, weekEnd);
      if (!agg) continue;
      pts.push({ label: weekLabel(new Date(k)), value: agg.value, n: agg.n, cards: agg.cards });
    }
    return pts;
  }

  function histDailyKpi3(cards, start, end) {
    var DAY = 86400000;
    var s = new Date(start.getFullYear(), start.getMonth(), start.getDate()).getTime();
    var e = new Date(end.getFullYear(), end.getMonth(), end.getDate()).getTime();
    var today = new Date();
    var pts = [];
    for (var k = s; k <= e; k += DAY) {
      var dayEnd = new Date(k); dayEnd.setHours(23, 59, 59, 999);
      if (dayEnd > today) dayEnd = today;
      var agg = kpi3AsOf(cards, dayEnd);
      if (!agg) continue;
      pts.push({ label: fmtDateBR(new Date(k)).slice(0, 5), value: agg.value, n: agg.n, cards: agg.cards });
    }
    return pts;
  }

  // Vazão e Tempo de entrega por semana, dentro de [start, end] — a partir dos
  // cards já em cache (filter=all cobre abertos + arquivados). Sem consulta nova.
  function histWeeklyDerived(metricKey, cards, start, end) {
    if (metricKey === 'kpi3') return histWeeklyKpi3(cards, start, end);
    var done = (cards || []).filter(function(c) { return c.concludedAt; });
    var byWeek = {};
    done.forEach(function(c) {
      var k = weekStartOf(new Date(c.concludedAt)).getTime();
      (byWeek[k] = byWeek[k] || []).push(c);
    });
    var startWeek = weekStartOf(start).getTime(), endWeek = weekStartOf(end).getTime(), WEEK = 604800000;
    var pts = [];
    for (var k = startWeek; k <= endWeek; k += WEEK) {
      var cs = byWeek[k] || [];
      var label = weekLabel(new Date(k));
      if (metricKey === 'kpi4') {
        pts.push({ label: label, value: cs.length, n: cs.length, cards: cs });
      } else { // kpi6 — média do lead time real das conclusões da semana
        var lts = cs.map(function(c) { return c.leadTimeReal; }).filter(function(v) { return v !== null && v !== undefined; });
        if (!lts.length) continue;               // semana sem entrega: não plota "0 d.u." (seria mentira)
        pts.push({ label: label, value: mean(lts), n: lts.length, cards: cs });
      }
    }
    return pts;
  }

  // Vazão e Tempo de entrega por DIA, dentro de [start, end] — mesmo princípio do
  // semanal, só que agrupando por dia em vez de semana ISO. Só se aplica aos
  // indicadores DERIVÁVEIS (kpi3/kpi4/kpi6): os demais usam histDailyRecorded, que lê do
  // snapshot diário registrado em vez de reconstruir dos cards.
  function histDailyDerived(metricKey, cards, start, end) {
    if (metricKey === 'kpi3') return histDailyKpi3(cards, start, end);
    var done = (cards || []).filter(function(c) { return c.concludedAt; });
    var byDay = {};
    done.forEach(function(c) {
      var d = new Date(c.concludedAt); d.setHours(0, 0, 0, 0);
      (byDay[d.getTime()] = byDay[d.getTime()] || []).push(c);
    });
    var DAY = 86400000;
    var s = new Date(start.getFullYear(), start.getMonth(), start.getDate()).getTime();
    var e = new Date(end.getFullYear(), end.getMonth(), end.getDate()).getTime();
    var pts = [];
    for (var k = s; k <= e; k += DAY) {
      var cs = byDay[k] || [];
      var label = fmtDateBR(new Date(k)).slice(0, 5); // dd/mm
      if (metricKey === 'kpi4') {
        pts.push({ label: label, value: cs.length, n: cs.length, cards: cs });
      } else {
        var lts = cs.map(function(c) { return c.leadTimeReal; }).filter(function(v) { return v !== null && v !== undefined; });
        if (!lts.length) continue;               // dia sem entrega: não plota "0 d.u." (seria mentira)
        pts.push({ label: label, value: mean(lts), n: lts.length, cards: cs });
      }
    }
    return pts;
  }

  // Série semanal registrada (weeklySnaps) → pontos cronológicos dentro de [start, end].
  function histWeeklyRecorded(metricKey, weeklyMap, start, end) {
    var keys = Object.keys(weeklyMap || {}).sort().filter(function(k) {
      var monday = isoWeekKeyToMonday(k);
      return monday >= start && monday <= end;
    });
    var pts = [];
    keys.forEach(function(k) {
      var v = weeklyMap[k][metricKey];
      if (!histHas(v)) return;
      var wk = k.split('_W');
      pts.push({ label: 'S' + wk[1], value: v, n: 1 });
    });
    return pts;
  }

  // Inverso de weekKeyOf: reconstrói a segunda-feira da semana ISO representada
  // pela chave "YYYY_Www" (mesma convenção usada para gravar weeklySnaps).
  function isoWeekKeyToMonday(key) {
    var parts = key.split('_W');
    var year = parseInt(parts[0], 10), week = parseInt(parts[1], 10);
    var jan4 = new Date(year, 0, 4);
    var jan4Dow = (jan4.getDay() + 6) % 7;
    var week1Monday = new Date(year, 0, 4 - jan4Dow);
    return new Date(week1Monday.getFullYear(), week1Monday.getMonth(), week1Monday.getDate() + (week - 1) * 7);
  }

  function histEarliestWeeklyMonday(weeklyMap) {
    var keys = Object.keys(weeklyMap || {}).sort(); // "YYYY_Www" ordena cronologicamente
    return keys.length ? isoWeekKeyToMonday(keys[0]) : null;
  }

  // Série DIÁRIA registrada (dailySnaps) → mesmo princípio de histWeeklyRecorded, só
  // que por dia. É o que dá granularidade diária aos indicadores "fotografia do
  // momento" (score, vencidos, retrabalho, conformidade) — que não são reconstruíveis
  // no passado, mas passam a ser registrados dia a dia daqui pra frente. (Aging/kpi3
  // usa outra rota — ver HIST_DERIVAVEL; permanece aqui só para não quebrar o payload.)
  // Cada dia é um ARRAY compacto (ver DAILY_FIELDS/saveDailySnapshot), não um objeto.
  function histDailyRecorded(metricKey, dailyMap, start, end) {
    var idx = DAILY_FIELDS.indexOf(metricKey);
    if (idx === -1) return [];
    var keys = Object.keys(dailyMap || {}).sort().filter(function(k) {
      var d = dayKeyToDate(k);
      return d >= start && d <= end;
    });
    var pts = [];
    keys.forEach(function(k) {
      var row = dailyMap[k];
      var v = Array.isArray(row) ? row[idx] : undefined;
      if (!histHas(v)) return;
      pts.push({ label: fmtDateBR(dayKeyToDate(k)).slice(0, 5), value: v, n: 1 });
    });
    return pts;
  }

  function dayKeyToDate(key) {
    var p = key.split('-');
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  }

  function histEarliestDailyDay(dailyMap) {
    var keys = Object.keys(dailyMap || {}).sort(); // "YYYY-MM-DD" ordena cronologicamente
    return keys.length ? dayKeyToDate(keys[0]) : null;
  }

  // ── estado da comparação (transiente; nada persistido) ──
  var histSnapshots = [];       // ordenados do mais recente p/ o mais antigo
  var histWeekly = {};          // mapa weeklySnaps
  var histDaily = {};           // mapa dailySnaps
  var histMonthNames = [];
  var histBaseIdx = 0;          // índice em histSnapshots do mês "atual" da comparação
  var histRefIdx = 1;           // índice do mês de referência (base de comparação)
  // Período CRU escolhido pelo usuário (texto ou calendário). Alimenta o drill-down
  // por dia/semana com as datas EXATAS — os tiles (delta mês a mês) continuam usando
  // os snapshots mensais mais próximos. null = sem escolha ainda (usa o padrão).
  var histPeriodStart = null;
  var histPeriodEnd = null;

  function histMetricByKey(k) {
    for (var i = 0; i < HIST_METRICS.length; i++) if (HIST_METRICS[i].key === k) return HIST_METRICS[i];
    return null;
  }
  function histMonthLabel(s) { return histMonthNames[s.month] + '/' + s.year; }

  // ─── HIST: SELETOR DE PERÍODO (dd/mm/aaaa + calendário) ─────────────
  // Cada snapshot é mensal, então "escolher um período" aqui significa escolher
  // 2 meses já registrados para comparar — o texto/calendário só é uma forma
  // mais direta de apontar esses 2 meses. "Fim" vira o mês base (o que está
  // sendo avaliado agora, 1º dropdown de antes) e "Início" vira o mês de
  // referência (2º dropdown) — reaproveita 100% do motor de tendência já
  // existente (histTileState, sparkline, drill-down), sem lógica de cálculo nova.
  var HISTDATE_WEEKDAYS = ['D','S','T','Q','Q','S','S'];
  // Cada campo (Início/Fim) tem seu PRÓPRIO calendário, popover e mês em exibição —
  // são independentes: abrir um não mexe no outro, e cada um seleciona e fecha na hora.
  var histCalView = { start: new Date(), end: new Date() };
  var histOpenField = null;   // 'start' | 'end' | null — qual popover está aberto agora

  function formatBRDate(date) {
    if (!date) return '';
    return String(date.getDate()).padStart(2,'0')+'/'+String(date.getMonth()+1).padStart(2,'0')+'/'+date.getFullYear();
  }

  function parseBRDate(str) {
    if (typeof str !== 'string') return null;
    var m = str.trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (!m) return null;
    var day = parseInt(m[1], 10), month = parseInt(m[2], 10), year = parseInt(m[3], 10);
    if (month < 1 || month > 12) return null;
    var date = new Date(year, month - 1, day);
    // new Date() rola dias inválidos (ex: 31/02) para o mês seguinte; comparar
    // os componentes de volta garante que só aceitamos datas de calendário reais.
    if (date.getDate() !== day || date.getMonth() !== month - 1 || date.getFullYear() !== year) return null;
    date.setHours(0,0,0,0);
    return date;
  }

  // Máscara dd/mm/aaaa que PRESERVA a posição do cursor (o bug reportado: o campo
  // "travava"/jogava o cursor pro fim a cada tecla, porque a versão antiga reescrevia
  // o valor inteiro sem realocar a posição). Insere as barras automaticamente e, ao
  // completar os 8 dígitos, sincroniza o período e o calendário deste campo ao vivo.
  function attachDateMask(input, field) {
    input.addEventListener('input', function() {
      var cursorPos = input.selectionStart;
      var prevLen = input.value.length;
      var digits = input.value.replace(/\D/g, '').slice(0, 8);
      var out = digits;
      if (digits.length > 4) out = digits.slice(0,2)+'/'+digits.slice(2,4)+'/'+digits.slice(4);
      else if (digits.length > 2) out = digits.slice(0,2)+'/'+digits.slice(2);
      input.value = out;
      var newPos = Math.max(0, Math.min(out.length, cursorPos + (out.length - prevLen)));
      input.setSelectionRange(newPos, newPos);

      if (digits.length < 8) { showHistDateError(''); return; }
      var d = parseBRDate(out);
      if (!d) { showHistDateError('Data ' + (field === 'start' ? 'de início' : 'de fim') + ' inválida.'); return; }
      if (field === 'start') histPeriodStart = d; else histPeriodEnd = d;
      histCalView[field] = new Date(d.getFullYear(), d.getMonth(), 1);
      if (histOpenField === field) renderHistFieldPopover(field); // reflete a seleção no calendário ao vivo
      showHistDateError('');
      debouncedCommitHistPeriod();
    });
  }

  function histIndexForMonth(year, month1) {
    for (var i = 0; i < histSnapshots.length; i++) {
      if (histSnapshots[i].year === year && histSnapshots[i].month === month1) return i;
    }
    return -1;
  }

  function histSnapshotDate(s) { return new Date(s.year, s.month - 1, 1); }

  // Janela do drill-down (Semanal/Mensal) = o período escolhido no seletor
  // Início/Fim acima (histRefIdx → histBaseIdx), não mais um "últimas N
  // semanas"/"todos os meses" fixo — conecta o seletor de período à evolução
  // mostrada no modal de cada tile.
  function histSelectedPeriod() {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    // 1) Se o usuário escolheu um período explícito, o drill-down usa exatamente essas
    //    datas — é isso que dá a "apuração detalhada" por dia/semana no intervalo pedido.
    if (histPeriodStart && histPeriodEnd) {
      var end0 = new Date(histPeriodEnd); end0.setHours(0, 0, 0, 0);
      if (end0 > today) end0 = today;
      return { start: new Date(histPeriodStart), end: end0 };
    }
    // 2) Sem escolha: cai no intervalo derivado dos snapshots (ref → fim do mês base).
    var base = histSnapshots[histBaseIdx] || histSnapshots[0];
    if (!base) return null;
    var ref = (histRefIdx >= 0 ? histSnapshots[histRefIdx] : null);
    var baseMonthStart = histSnapshotDate(base);
    var start = (ref && histSnapshotDate(ref) <= baseMonthStart) ? histSnapshotDate(ref) : baseMonthStart;
    var end = new Date(baseMonthStart.getFullYear(), baseMonthStart.getMonth() + 1, 0); // último dia do mês base
    if (end > today) end = today; // mês corrente ainda não terminou
    return { start: start, end: end };
  }

  // Índice do snapshot mensal mais recente cujo mês começou EM OU ANTES de `date`.
  // histSnapshots está do mais recente p/ o mais antigo, então o 1º que satisfaz vence.
  function histSnapshotIdxOnOrBefore(date) {
    for (var i = 0; i < histSnapshots.length; i++) {
      if (histSnapshotDate(histSnapshots[i]) <= date) return i;
    }
    return -1;
  }

  function showHistDateError(msg) {
    var el = document.getElementById('hist-date-error');
    if (!el) return;
    el.textContent = msg || '';
    el.style.display = msg ? '' : 'none';
  }

  function currentHistFieldDate(field) { return field === 'start' ? histPeriodStart : histPeriodEnd; }

  // Recalcula os tiles (delta mês a mês) a partir de histPeriodStart/histPeriodEnd.
  // Cada campo se ancora no snapshot mensal mais próximo (≤ a data escolhida) — não
  // exige mais que a data caia exatamente num mês com snapshot registrado.
  function commitHistPeriod() {
    if (!histPeriodStart || !histPeriodEnd) return; // aguarda os dois campos antes de recalcular
    if (histPeriodStart > histPeriodEnd) { showHistDateError('A data de início deve ser anterior à data de fim.'); return; }

    var endIdx = histSnapshotIdxOnOrBefore(histPeriodEnd);
    var startIdx = histSnapshotIdxOnOrBefore(histPeriodStart);

    if (endIdx === -1 && startIdx === -1) {
      // Não há snapshot mensal até nenhuma das datas — sem base p/ o delta dos tiles.
      histBaseIdx = 0;
      histRefIdx = -1;
      showHistDateError('Ainda não há snapshot mensal até o período escolhido — o gráfico detalhado (dia/semana) funciona, mas os cards ficam sem variação.');
    } else {
      if (endIdx === -1) endIdx = startIdx;   // usa o único lado disponível
      if (startIdx === -1) startIdx = endIdx;
      histBaseIdx = endIdx;
      histRefIdx = (startIdx === endIdx) ? -1 : startIdx; // mesmo mês → sem delta
      showHistDateError('');
    }
    refreshHistTrend();
  }
  var debouncedCommitHistPeriod = debounce(commitHistPeriod, 350);

  function histDaysInMonth(year, month0) { return new Date(year, month0 + 1, 0).getDate(); }
  function histIsSameDay(a, b) { return !!a && !!b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function histIsDateInRange(d, start, end) { return !!start && !!end && d > start && d < end; }

  // Grade do calendário de UM campo. Destaca: a data já escolhida NESTE campo
  // ('selected'), a data do OUTRO campo ('selected-other', contorno fino — dá a ver o
  // período inteiro enquanto se ajusta uma ponta) e os dias entre as duas ('in-range').
  function renderHistCalendarGrid(field, viewDate) {
    var year = viewDate.getFullYear(), month0 = viewDate.getMonth();
    var firstDow = new Date(year, month0, 1).getDay();
    var total = histDaysInMonth(year, month0);
    var temSnapshotNoMes = histIndexForMonth(year, month0 + 1) !== -1;
    var mine = currentHistFieldDate(field);
    var other = currentHistFieldDate(field === 'start' ? 'end' : 'start');
    var rangeStart = histPeriodStart, rangeEnd = histPeriodEnd;
    var hasRange = !!(rangeStart && rangeEnd && rangeStart <= rangeEnd);

    var h = '<div class="histdate-cal-header">';
    h += '<button type="button" class="histdate-cal-nav histdate-cal-prev-y" title="Ano anterior">«</button>';
    h += '<button type="button" class="histdate-cal-nav histdate-cal-prev-m" title="Mês anterior">‹</button>';
    h += '<span class="histdate-cal-title">' + histMonthNames[month0+1] + ' de ' + year + '</span>';
    h += '<button type="button" class="histdate-cal-nav histdate-cal-next-m" title="Próximo mês">›</button>';
    h += '<button type="button" class="histdate-cal-nav histdate-cal-next-y" title="Próximo ano">»</button>';
    h += '</div>';
    // Marca (informativa, não restritiva) os meses que têm snapshot mensal — é onde o
    // delta dos cards se ancora. Qualquer dia continua selecionável para o gráfico.
    if (temSnapshotNoMes) h += '<div class="histdate-cal-hassnap">● tem snapshot mensal</div>';
    h += '<div class="histdate-cal-weekdays">';
    HISTDATE_WEEKDAYS.forEach(function(w) { h += '<span>' + w + '</span>'; });
    h += '</div><div class="histdate-cal-days">';
    for (var blank=0; blank<firstDow; blank++) h += '<span class="histdate-cal-day empty"></span>';
    for (var day=1; day<=total; day++) {
      var d = new Date(year, month0, day);
      // TODOS os dias são selecionáveis: o período é livre e o gráfico detalhado usa as
      // datas exatas; os cards apenas se ancoram no snapshot mensal mais próximo.
      var cls = 'histdate-cal-day has-data';
      if (histIsSameDay(d, mine)) cls += ' selected';
      else if (histIsSameDay(d, other)) cls += ' selected-other';
      else if (hasRange && histIsDateInRange(d, rangeStart, rangeEnd)) cls += ' in-range';
      if (histIsSameDay(d, new Date())) cls += ' today';
      h += '<span class="' + cls + '" data-date="' + d.getTime() + '">' + day + '</span>';
    }
    h += '</div>';
    return h;
  }

  // Escolha rápida e confiável dos meses com snapshot (navegar mês a mês no
  // calendário até achar um mês com dado seria tedioso se houver lacunas).
  function renderHistMonthChips() {
    if (!histSnapshots.length) return '';
    var h = '<div class="histdate-chips">';
    histSnapshots.slice().reverse().forEach(function(s) { // cronológico, mais antigo primeiro
      h += '<button type="button" class="histdate-chip" data-chip-date="' + histSnapshotDate(s).getTime() + '">' + escHtml(histMonthLabel(s)) + '</button>';
    });
    h += '</div>';
    return h;
  }

  function histDateOutsideClick(e) {
    if (!histOpenField) return;
    var wrap = document.getElementById('histdate-field-' + histOpenField);
    if (wrap && !wrap.contains(e.target)) closeAllHistPopovers();
  }

  function closeAllHistPopovers() {
    ['start', 'end'].forEach(function(f) {
      var pop = document.getElementById('hist-date-popover-' + f);
      if (pop) pop.style.display = 'none';
    });
    histOpenField = null;
    document.removeEventListener('click', histDateOutsideClick);
  }

  // Seleciona `date` para o campo `field`: grava, escreve no input, fecha o popover
  // DESSE campo (seleção de um único dia = pronto, sem passo extra de "Aplicar") e
  // recalcula os tiles. O outro campo permanece como estava.
  function pickHistFieldDate(field, date) {
    if (field === 'start') histPeriodStart = date; else histPeriodEnd = date;
    var input = document.getElementById('hist-date-' + field);
    if (input) input.value = formatBRDate(date);
    showHistDateError('');
    closeAllHistPopovers();
    commitHistPeriod();
  }

  function renderHistFieldPopover(field) {
    var pop = document.getElementById('hist-date-popover-' + field);
    if (!pop) return;
    var view = histCalView[field];
    var h = renderHistMonthChips();
    h += renderHistCalendarGrid(field, view);
    pop.innerHTML = h;

    function nav(delta, unit) {
      histCalView[field] = unit === 'y'
        ? new Date(view.getFullYear() + delta, view.getMonth(), 1)
        : new Date(view.getFullYear(), view.getMonth() + delta, 1);
      renderHistFieldPopover(field);
    }
    pop.querySelector('.histdate-cal-prev-y').addEventListener('click', function(e) { e.stopPropagation(); nav(-1, 'y'); });
    pop.querySelector('.histdate-cal-prev-m').addEventListener('click', function(e) { e.stopPropagation(); nav(-1, 'm'); });
    pop.querySelector('.histdate-cal-next-m').addEventListener('click', function(e) { e.stopPropagation(); nav(1, 'm'); });
    pop.querySelector('.histdate-cal-next-y').addEventListener('click', function(e) { e.stopPropagation(); nav(1, 'y'); });
    pop.querySelectorAll('.histdate-cal-day:not(.empty)').forEach(function(el) {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        pickHistFieldDate(field, new Date(parseInt(this.getAttribute('data-date'), 10)));
      });
    });
    pop.querySelectorAll('.histdate-chip').forEach(function(el) {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        histCalView[field] = new Date(parseInt(this.getAttribute('data-chip-date'), 10));
        renderHistFieldPopover(field);
      });
    });
  }

  // Abre o calendário ANCORADO no campo clicado — Início e Fim são independentes;
  // abrir um fecha o outro (evita dois popovers sobrepostos).
  function openHistPopover(field) {
    if (histOpenField === field) return;
    closeAllHistPopovers();
    histOpenField = field;
    var cur = currentHistFieldDate(field);
    histCalView[field] = cur ? new Date(cur.getFullYear(), cur.getMonth(), 1) : new Date();
    var pop = document.getElementById('hist-date-popover-' + field);
    if (!pop) return;
    pop.style.display = '';
    renderHistFieldPopover(field);
    setTimeout(function() { document.addEventListener('click', histDateOutsideClick); }, 0);
  }

  function renderHistDatePickerHtml() {
    var startVal = formatBRDate(histPeriodStart);
    var endVal = formatBRDate(histPeriodEnd);
    // Ícone de calendário INLINE (self-contained) — o SVG externo por CDN podia não
    // carregar no iframe do Power-Up, deixando o botão aparentemente "quebrado".
    var calIcon = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>';
    function field(id, label, val) {
      var h = '<div class="histdate-field" id="histdate-field-' + id + '">';
      h += '<label>' + label + '</label>';
      h += '<div class="histdate-input-wrap"><input type="text" id="hist-date-' + id + '" placeholder="dd/mm/aaaa" maxlength="10" inputmode="numeric" autocomplete="off" value="' + val + '"><span class="histdate-input-icon">' + calIcon + '</span></div>';
      h += '<div class="histdate-popover" id="hist-date-popover-' + id + '" style="display:none;"></div>';
      h += '</div>';
      return h;
    }
    var h = '<div class="histdate-picker">';
    h += field('start', 'Início', startVal);
    h += '<span class="histdate-sep">–</span>';
    h += field('end', 'Fim', endVal);
    h += '</div>';
    h += '<p class="hist-note histdate-error" id="hist-date-error" style="display:none;"></p>';
    return h;
  }

  function wireHistDatePicker() {
    ['start', 'end'].forEach(function(field) {
      var input = document.getElementById('hist-date-' + field);
      if (!input) return;
      attachDateMask(input, field);
      input.addEventListener('focus', function() { openHistPopover(field); });
      input.addEventListener('click', function(e) { e.stopPropagation(); openHistPopover(field); });
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') { closeAllHistPopovers(); input.blur(); }
      });
    });
  }

  // Calcula o estado de um tile (valor, delta, cor) — isolado p/ ficar testável.
  function histTileState(m, base, ref) {
    var v = base ? base.data[m.key] : undefined;
    var pv = ref ? ref.data[m.key] : undefined;
    var temV = histHas(v);
    // delta só existe se AMBOS os meses tiverem o indicador (snapshots antigos não
    // gravavam kpi5/kpi6 — nesse caso mostramos "—" em vez de inventar um número).
    var temDelta = temV && histHas(pv);
    // Diferença calculada a partir dos MESMOS valores exibidos (já arredondados a 1
    // casa por round1): garante que o número mostrado no delta corresponda exatamente
    // à diferença entre os dois valores que o usuário vê nos snapshots.
    var delta = temDelta ? round1(round1(v) - round1(pv)) : 0;
    var semVariacao = temDelta && delta === 0;
    var classe, seta;
    if (!temDelta || semVariacao) {
      classe = 'neutral';
      seta = '•';
    } else {
      // "bom" = o indicador MELHOROU. Tipo A (quanto maior melhor): subir é bom.
      // Tipo B (quanto menor melhor: vencidos, rework, aging, entrega): cair é bom.
      var bom = (m.tipo === 'A') ? delta > 0 : delta < 0;
      // COR reflete o JUÍZO (melhorou/piorou): verde = melhorou, vermelho = piorou —
      // inclusive nos KPIs "quanto menor melhor", onde uma QUEDA é boa.
      classe = bom ? 'good' : 'bad';
      // SETA reflete a DIREÇÃO REAL do número (subiu ▲ / caiu ▼) — padrão de mercado.
      // Como a COR já carrega o juízo, a seta pode seguir o valor sem gerar contradição
      // (ex.: vencidos que caem → ▼ verde; vencidos que sobem → ▲ vermelho).
      seta = delta > 0 ? '▲' : '▼';
    }
    return { v: v, temV: temV, temDelta: temDelta, semVariacao: semVariacao, delta: delta, classe: classe, seta: seta, cor: HIST_COR[classe] };
  }

  // Cabeçalho + seletor de datas (renderizado UMA vez; nunca re-renderizado ao trocar
  // o período, para que o campo de texto não seja destruído no meio da digitação).
  function renderHistTrend() {
    var snapshots = histSnapshots;
    if (!snapshots.length) return '';
    // Semeia o período cru com o padrão derivado dos snapshots (mês de referência → fim
    // do mês base) — só quando ainda não há escolha do usuário. Dali em diante, o campo
    // Início/Fim reflete exatamente o que a pessoa digitou/selecionou.
    if (!histPeriodStart || !histPeriodEnd) {
      var base0 = snapshots[histBaseIdx] || snapshots[0];
      var ref0 = (histRefIdx >= 0 ? snapshots[histRefIdx] : null);
      if (base0) {
        var bStart0 = histSnapshotDate(base0);
        var bEnd0 = new Date(bStart0.getFullYear(), bStart0.getMonth() + 1, 0);
        var today0 = new Date(); today0.setHours(0, 0, 0, 0);
        if (bEnd0 > today0) bEnd0 = today0;
        histPeriodEnd = bEnd0;
        histPeriodStart = ref0 ? histSnapshotDate(ref0) : bStart0;
      }
    }
    var h = '';
    h += '<div class="hist-head">';
    h += '<h3>Tendência</h3>';
    if (snapshots.length > 1) h += renderHistDatePickerHtml();
    h += '</div>';
    // Só os tiles vivem num host próprio, que é o ÚNICO trecho re-renderizado quando
    // o usuário muda as datas — preserva o foco/cursor do seletor acima.
    h += '<div id="hist-tiles">' + renderHistTiles() + '</div>';
    return h;
  }

  // Grade de tiles + sparklines. Isolada para poder ser recalculada sozinha.
  function renderHistTiles() {
    var snapshots = histSnapshots;
    if (!snapshots.length) return '';
    var base = snapshots[histBaseIdx] || snapshots[0];
    var ref = (histRefIdx >= 0 ? snapshots[histRefIdx] : null) || null;
    var asc = snapshots.slice().reverse().slice(-12);       // cronológico p/ o sparkline

    var h = '';
    if (!ref) {
      h += '<div class="hist-note">' + (snapshots.length > 1
        ? 'O período escolhido cai num único mês com snapshot — mostrando os valores atuais, sem variação. Escolha datas em meses diferentes para comparar.'
        : 'Apenas um mês registrado — não há base de comparação ainda.') + '</div>';
    }

    h += '<div class="hist-trend">';
    HIST_METRICS.forEach(function(m) {
      var st = histTileState(m, base, ref);
      var serie = asc.map(function(s) { return s.data[m.key]; }).filter(histHas);

      h += '<div class="hist-tile hist-clickable" data-hist="' + m.key + '" role="button" tabindex="0" title="Ver evolução de ' + escHtml(m.name) + '">';
      h += '<div class="hist-tile-name">' + escHtml(m.name) + '</div>';
      h += '<div class="hist-tile-value">' + (st.temV ? escHtml(histNum(st.v) + m.unit) : '—') + '</div>';
      h += '<div class="hist-tile-foot">';
      if (st.temDelta && !st.semVariacao) {
        // A seta (▲/▼) já indica a direção do número e a cor indica se é bom/ruim;
        // mostra só a magnitude (sem sinal +/-) para não duplicar nem contradizer a seta.
        h += '<span class="hist-delta ' + st.classe + '">' + st.seta + ' ' + escHtml(histNum(Math.abs(st.delta)) + m.du) + '</span>';
        h += '<span class="hist-vs">vs ' + escHtml(histMonthLabel(ref)) + '</span>';
      } else if (st.semVariacao) {
        // Sem variação: neutro limpo em vez de "• 0 d.u." (que parecia um delta real).
        h += '<span class="hist-delta neutral">' + st.seta + ' estável</span>';
        h += '<span class="hist-vs">vs ' + escHtml(histMonthLabel(ref)) + '</span>';
      } else {
        h += '<span class="hist-delta neutral">—</span>';
        h += '<span class="hist-vs">' + escHtml(ref ? 'sem base de comparação' : 'primeiro registro') + '</span>';
      }
      h += '</div>';
      h += histSpark(serie, st.cor);
      h += '<span class="hist-drill">ver evolução →</span>';
      h += '</div>';
    });
    h += '</div>';
    return h;
  }

  // Render COMPLETO (cabeçalho + tiles) — só no primeiro desenho da faixa.
  function renderHistTrendInto() {
    var host = document.getElementById('hist-trend-host');
    if (!host) return;
    host.innerHTML = renderHistTrend();
    wireHistTrend();
  }

  // Atualiza APENAS os tiles quando o período muda — os campos de texto já refletem a
  // escolha (quem os alterou foi a própria digitação ou o clique no calendário).
  function refreshHistTrend() {
    var tilesHost = document.getElementById('hist-tiles');
    if (tilesHost) { tilesHost.innerHTML = renderHistTiles(); rewireHistTiles(); }
  }

  function wireHistTrend() {
    var host = document.getElementById('hist-trend-host');
    if (!host) return;
    wireHistDatePicker();
    rewireHistTiles();
  }

  function rewireHistTiles() {
    var host = document.getElementById('hist-tiles');
    if (!host) return;
    host.querySelectorAll('.hist-clickable').forEach(function(el) {
      function open() { openHistChart(el.getAttribute('data-hist')); }
      el.addEventListener('click', open);
      el.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
      });
    });
  }

  // ── drill-down: evolução do indicador (Semanal / Diário) ──
  // Reutiliza o modal e o gráfico de linha da aba Análises (CP.openModal / CP.lineChart).
  // Todo indicador agora tem versão DIÁRIA: os deriváveis (kpi3/kpi4/kpi6) são
  // reconstruídos dos próprios cards para qualquer data passada; os demais ("fotografia
  // do momento") passam a ser registrados dia a dia (dailySnaps) a partir de agora.
  function openHistChart(metricKey) {
    if (typeof CP === 'undefined' || !CP || typeof CP.openModal !== 'function') return;
    var m = histMetricByKey(metricKey);
    if (!m) return;
    var base = histSnapshots[histBaseIdx] || histSnapshots[0];
    var st = base ? histTileState(m, base, histSnapshots[histRefIdx] || null) : { cor: HIST_COR.neutral };
    var cor = st.cor;
    var modo = 'week';
    var periodo = histSelectedPeriod();
    var periodoLabel = periodo ? (formatBRDate(periodo.start) + ' – ' + formatBRDate(periodo.end)) : '';
    var lastPts = [];    // pontos do último desenho — resolve o clique num ponto (drill-down p/ cards)
    var hasClickable = false;

    function chartHtml() {
      var pts, nota;
      lastPts = []; hasClickable = false;
      if (!periodo) return CP.emptyChart('Sem período selecionado.');

      if (modo === 'week') {
        if (HIST_DERIVAVEL[metricKey]) {
          if (!cachedData) return '<div class="hist-collect"><b>Sem dados carregados.</b><span>Abra a aba <b>Tempo real</b> uma vez para calcular a série semanal.</span></div>';
          pts = histWeeklyDerived(metricKey, cachedData.cards, periodo.start, periodo.end);
          nota = (metricKey === 'kpi3'
            ? 'Série semanal calculada a partir da timeline de etapas dos próprios cards (retroativa)'
            : 'Série semanal calculada a partir da data de conclusão dos cards (retroativa)') +
            ' — período ' + escHtml(periodoLabel) + '. Clique num ponto para ver os cards da semana.';
        } else {
          // "Fotografia do momento": só existe registro semanal a partir de quando o
          // snapshot semanal começou. Em vez de recusar o período inteiro, RECORTA para
          // a cobertura disponível e plota o que existe (sem inventar o que falta).
          var earliestWeekly = histEarliestWeeklyMonday(histWeekly);
          if (!earliestWeekly) {
            return '<div class="hist-collect"><b>Ainda coletando…</b>' +
              '<span>Este indicador é uma fotografia do momento e o registro semanal ainda não começou.</span>' +
              '<span>Para uma apuração detalhada agora, veja <b>Vazão mensal</b>, <b>Tempo de entrega</b> ou <b>Tempo na etapa</b> — esses têm série diária/semanal reconstruída dos próprios cards.</span></div>';
          }
          var wStart = periodo.start < earliestWeekly ? earliestWeekly : periodo.start;
          var recortou = periodo.start < earliestWeekly;
          pts = histWeeklyRecorded(metricKey, histWeekly, wStart, periodo.end);
          if (pts.length < 2) {
            return '<div class="hist-collect"><b>Coletando dados…</b>' +
              '<span>' + pts.length + ' semana(s) registrada(s) para este indicador até agora (coleta iniciada em ' + escHtml(formatBRDate(earliestWeekly)) + ').</span>' +
              '<span>É uma fotografia do momento — não é reconstruível no passado; a série cresce a cada acesso ao dashboard.</span>' +
              '<span>Para detalhe já disponível, veja <b>Vazão mensal</b>, <b>Tempo de entrega</b> ou <b>Tempo na etapa</b>.</span></div>';
          }
          nota = 'Série semanal registrada' + (recortou ? ' a partir de ' + escHtml(formatBRDate(earliestWeekly)) + ' (início da coleta)' : '') + ' — período ' + escHtml(periodoLabel) + '.';
        }
      } else { // modo === 'day'
        if (HIST_DERIVAVEL[metricKey]) {
          if (!cachedData) return '<div class="hist-collect"><b>Sem dados carregados.</b><span>Abra a aba <b>Tempo real</b> uma vez para calcular a série diária.</span></div>';
          pts = histDailyDerived(metricKey, cachedData.cards, periodo.start, periodo.end);
          nota = (metricKey === 'kpi3'
            ? 'Série diária calculada a partir da timeline de etapas dos próprios cards (retroativa)'
            : 'Série diária calculada a partir da data de conclusão dos cards (retroativa)') +
            ' — período ' + escHtml(periodoLabel) + '. Clique num ponto para ver os cards do dia.';
        } else {
          // Mesma lógica de "recorte de cobertura" do semanal, agora com o snapshot
          // DIÁRIO (dailySnaps): só existe registro a partir de quando começou a ser
          // gravado — não inventa pontos anteriores a isso.
          var earliestDaily = histEarliestDailyDay(histDaily);
          if (!earliestDaily) {
            return '<div class="hist-collect"><b>Ainda coletando…</b>' +
              '<span>Este indicador é uma fotografia do momento e o registro diário ainda não começou — passa a existir a partir do próximo acesso ao dashboard.</span>' +
              '<span>Enquanto isso, veja a evolução <b>semanal</b> acima, ou <b>Vazão mensal</b>/<b>Tempo de entrega</b>/<b>Tempo na etapa</b>, que têm série diária reconstruída dos próprios cards.</span></div>';
          }
          var dStart = periodo.start < earliestDaily ? earliestDaily : periodo.start;
          var recortouD = periodo.start < earliestDaily;
          pts = histDailyRecorded(metricKey, histDaily, dStart, periodo.end);
          if (pts.length < 2) {
            return '<div class="hist-collect"><b>Coletando dados…</b>' +
              '<span>' + pts.length + ' dia(s) registrado(s) para este indicador até agora (coleta iniciada em ' + escHtml(formatBRDate(earliestDaily)) + ').</span>' +
              '<span>É uma fotografia do momento — não é reconstruível no passado; a série cresce a cada acesso ao dashboard.</span>' +
              '<span>Enquanto isso, veja a evolução <b>semanal</b> acima.</span></div>';
          }
          nota = 'Série diária registrada' + (recortouD ? ' a partir de ' + escHtml(formatBRDate(earliestDaily)) + ' (início da coleta)' : '') + ' — período ' + escHtml(periodoLabel) + '.';
        }
      }
      if (!pts.length) return CP.emptyChart('Sem dados para plotar no período selecionado.');
      // O lineChart do CP embute o `tip` num <title> SVG (tooltip nativo) já escapado —
      // por isso o texto vai PURO aqui: tags HTML apareceriam literais no tooltip.
      // Pontos com `.cards` (indicadores deriváveis) viram clicáveis: `bucketId` aqui é
      // só um índice local (não usa o registro de buckets da aba Análises, que não
      // existe neste modal) — resolvido no listener de clique abaixo, via lastPts.
      pts.forEach(function(p, i) {
        var qtd = p.cards ? p.cards.length : (p.n > 1 ? p.n : null);
        p.tip = p.label + ': ' + histNum(p.value) + m.unit + (qtd !== null ? ' · ' + qtd + ' card(s)' : '');
        if (p.cards && p.cards.length) { p.bucketId = 'hpt' + i; hasClickable = true; }
      });
      lastPts = pts;
      return CP.lineChart(pts, cor) + '<div class="hist-note">' + escHtml(nota) + (hasClickable ? ' <b>Clique num ponto</b> para ver os cards.' : '') + '</div>';
    }

    function body() {
      var h = '<div class="pe-metric" role="group" aria-label="Periodicidade" id="hist-modo">';
      h += '<button class="pe-metric-opt' + (modo === 'week' ? ' on' : '') + '" data-modo="week">Semanal</button>';
      h += '<button class="pe-metric-opt' + (modo === 'day' ? ' on' : '') + '" data-modo="day">Diário</button>';
      h += '</div>';
      h += '<div id="hist-chart">' + chartHtml() + '</div>';
      return h;
    }

    var over = CP.openModal({
      title: m.name, sub: 'Evolução do indicador', color: cor, size: 'lg', body: body()
    });

    over.addEventListener('click', function(e) {
      var modoBtn = e.target.closest('[data-modo]');
      if (modoBtn) {
        var novo = modoBtn.getAttribute('data-modo');
        if (novo === modo) return;
        modo = novo;
        over.querySelectorAll('[data-modo]').forEach(function(x) { x.classList.toggle('on', x === modoBtn); });
        var c = over.querySelector('#hist-chart');
        if (c) c.innerHTML = chartHtml();
        return;
      }
      // Clique num ponto do gráfico (só os marcados com bucketId, ver chartHtml) → abre
      // a lista de cards daquele dia/semana, reaproveitando o mesmo modal de cards
      // usado em Análises Personalizadas (CP.openCards) — sem duplicar componente.
      var segEl = e.target.closest('[data-b]');
      if (!segEl || typeof CP.openCards !== 'function') return;
      var mm = /^hpt(\d+)$/.exec(segEl.getAttribute('data-b') || '');
      if (!mm) return;
      var p = lastPts[parseInt(mm[1], 10)];
      if (p && p.cards && p.cards.length) CP.openCards(m.name + ' · ' + p.label, p.cards, cor);
    });
  }

  // ─── HISTORY ────────────────────────────────────
  function loadHistory() {
    document.getElementById('hist-loading').style.display = '';
    document.getElementById('hist-content').style.display = 'none';

    t.get('board', 'shared').then(function(data) {
      var snapshots = [];
      if (data) {
        Object.keys(data).forEach(function(key) {
          if (key.indexOf('snapshot_') === 0) {
            var parts = key.replace('snapshot_','').split('_');
            snapshots.push({ key: key, year: parseInt(parts[0]), month: parseInt(parts[1]), data: data[key] });
          }
        });
      }
      snapshots.sort(function(a,b) { return b.year !== a.year ? b.year - a.year : b.month - a.month; });

      var now = new Date();
      var curMonth = now.getMonth()+1, curYear = now.getFullYear();
      var monthNames = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

      // Estado da faixa de tendência. weeklySnaps/dailySnaps vêm NO MESMO t.get acima
      // (o Trello devolve todo o 'board/shared') — nenhuma consulta extra.
      histSnapshots = snapshots;
      histWeekly = (data && data[WEEKLY_KEY] && typeof data[WEEKLY_KEY] === 'object') ? data[WEEKLY_KEY] : {};
      histDaily = (data && data[DAILY_KEY] && typeof data[DAILY_KEY] === 'object') ? data[DAILY_KEY] : {};
      histMonthNames = monthNames;
      histBaseIdx = 0;
      histRefIdx = snapshots.length > 1 ? 1 : -1;
      histPeriodStart = null;   // reinicia o período escolhido a cada (re)carga do Histórico
      histPeriodEnd = null;

      var html = '';
      if (!snapshots.length) {
        html = '<div class="history-empty"><p>O histórico será gerado automaticamente a partir do próximo acesso mensal.</p></div>';
      } else {
        // Cards de tendência (aditivo) — host próprio p/ re-render local ao trocar as datas.
        html += '<div id="hist-trend-host"></div>';

        html += '<div class="table-header-row">';
        html += '<h3>Snapshots mensais</h3>';
        html += '<button class="btn-table-download" id="btn-dl-history">⬇ Exportar histórico</button>';
        html += '</div>';
        html += '<div class="table-scroll"><table class="history-table"><thead><tr>';
        html += '<th>Mês</th><th>Health Score</th><th>Vencidos</th><th>Rework</th><th>Entrega</th><th>Na etapa</th><th>Throughput</th><th>Conformidade</th><th>Cards</th>';
        html += '</tr></thead><tbody>';
        snapshots.forEach(function(s) {
          var isCurrent = s.month === curMonth && s.year === curYear;
          html += '<tr'+(isCurrent?' class="current-month"':'')+'>';
          html += '<td>'+monthNames[s.month]+'/'+s.year+'</td>';
          html += '<td>'+s.data.score+'</td>';
          html += '<td>'+s.data.kpi1+'%</td>';
          html += '<td>'+s.data.kpi2+'</td>';
          html += '<td>'+(s.data.kpi6 !== undefined ? s.data.kpi6+' d.u.' : '—')+'</td>';
          html += '<td>'+s.data.kpi3+' d.u.</td>';
          html += '<td>'+s.data.kpi4+'</td>';
          html += '<td>'+(s.data.kpi5 !== undefined ? s.data.kpi5+'%' : '—')+'</td>';
          html += '<td>'+s.data.totalCards+'</td>';
          html += '</tr>';
        });
        html += '</tbody></table></div>';
      }

      html += '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">';
      html += '<button class="btn btn-secondary" id="btn-force-snap">Salvar snapshot agora</button>';
      html += '<button class="btn btn-secondary" id="btn-dl-image">⬇ Baixar imagem</button>';
      html += '</div>';

      var el = document.getElementById('hist-content');
      el.innerHTML = html;
      el.style.display = '';
      document.getElementById('hist-loading').style.display = 'none';

      // Preenche a faixa de tendência e conecta seletor de datas + drill-down.
      renderHistTrendInto();

      document.getElementById('btn-force-snap').addEventListener('click', function() {
        if (!cachedData) {
          alert('Acesse a aba "Tempo real" primeiro para carregar os dados.');
          return;
        }
        var kpis = calcKPIs(cachedData.cards, cachedData.config);
        // Salva o snapshot do mês, da semana E do dia correntes (sobrescrevendo), para
        // que o botão popule as séries semanal e diária imediatamente.
        Promise.all([ forceSnapshot(kpis, cachedData.config), saveWeeklySnapshot(kpis, true), saveDailySnapshot(kpis, true) ])
          .then(function() { loadHistory(); })
          .catch(function() { alert('Não foi possível salvar o snapshot. Tente novamente.'); });
      });

      // Snapshot VISUAL (imagem) do dashboard — usa os dados já carregados (cachedData)
      document.getElementById('btn-dl-image').addEventListener('click', function() {
        exportDashboardImage(cachedData, this);
      });

      var dlHist = document.getElementById('btn-dl-history');
      if (dlHist) dlHist.addEventListener('click', function() {
        var rows = [['Mês','Health Score','Vencidos','Rework','Entrega (lead time)','Na etapa (aging)','Throughput','Conformidade','Cards']];
        snapshots.forEach(function(s) {
          rows.push([
            monthNames[s.month]+'/'+s.year,
            s.data.score, s.data.kpi1+'%', s.data.kpi2,
            s.data.kpi6 !== undefined ? s.data.kpi6+' d.u.' : '—',
            s.data.kpi3+' d.u.', s.data.kpi4,
            s.data.kpi5 !== undefined ? s.data.kpi5+'%' : '—',
            s.data.totalCards
          ]);
        });
        downloadCSV('historico_midiatica.csv', rows);
      });
    }).catch(function(err) {
      // sem isto, uma falha do t.get deixava o spinner girando para sempre
      document.getElementById('hist-loading').style.display = 'none';
      var el = document.getElementById('hist-content');
      el.innerHTML = '<div class="history-empty"><p>Erro ao carregar o histórico: ' +
        escHtml(err && err.message ? err.message : String(err)) + '</p></div>';
      el.style.display = '';
    });
  }

  // ─── CONFIG ─────────────────────────────────────
  function renderConfig() {
    t.get('board', 'shared', 'healthConfig').then(function(cfg) {
      var config = mergeConfig(cfg);
      var html = '';

      html += '<div class="config-section"><h3>Metas</h3>';
      // Métrica percentual: o range vai de 0 a 100% (antes ia só até 50, o que travava
      // o preenchimento da barra na metade e impedia metas acima de 50%).
      html += sliderRow('meta_prazo', 'Meta máx. de cards vencidos', config.meta_prazo, 0, 100, 5, '%');
      html += sliderRow('meta_rework', 'Meta retrabalhos máximo', config.meta_rework, 0, 1000, 5, ' retrabalhos');
      html += sliderRow('meta_leadtime_real', 'Meta tempo de entrega (lead time real)', config.meta_leadtime_real, 2, 60, 1, ' d.u.');
      html += sliderRow('meta_leadtime', 'Meta tempo na etapa (aging)', config.meta_leadtime, 2, 20, 1, ' d.u.');
      html += sliderRow('meta_through', 'Meta throughput mensal', config.meta_through, 5, 1000, 5, ' cards');
      html += sliderRow('meta_conformidade', 'Meta conformidade de processo', config.meta_conformidade, 50, 100, 5, '%');
      html += '</div>';

      html += '<div class="config-section"><h3>Pesos do Health Score</h3>';
      html += '<div class="peso-sum valid" id="peso-sum">Soma dos pesos: 100</div>';
      html += sliderRow('peso1', 'Peso cards vencidos', config.peso1, 10, 60, 5, '');
      html += sliderRow('peso2', 'Peso rework', config.peso2, 5, 40, 5, '');
      html += sliderRow('peso6', 'Peso tempo de entrega (lead time real)', config.peso6, 5, 40, 5, '');
      html += sliderRow('peso3', 'Peso tempo na etapa (aging)', config.peso3, 5, 40, 5, '');
      html += sliderRow('peso4', 'Peso throughput', config.peso4, 5, 30, 5, '');
      html += sliderRow('peso5', 'Peso conformidade', config.peso5, 5, 40, 5, '');
      html += '</div>';

      html += '<div class="config-section"><h3>SLA por etapa (dias úteis)</h3>';
      html += '<div class="sla-grid">';
      FLOW_LISTS.forEach(function(n, i) {
        if (n === 'Concluído 🏆') return;
        var val = config.sla && config.sla[n] !== undefined ? config.sla[n] : DEFAULT_SLA[n];
        html += '<div class="sla-row">';
        html += '<label>'+escHtml(n)+'</label>';
        html += '<input type="number" id="sla_'+i+'" min="1" max="30" value="'+val+'" data-list="'+escHtml(n)+'">';
        html += '<span class="sla-unit">d.u.</span>';
        html += '</div>';
      });
      html += '</div></div>';

      html += '<div class="config-footer">';
      html += '<button class="btn" id="btn-save-config">Salvar configurações</button>';
      html += '<span class="config-msg" id="cfg-msg" style="display:none;"></span>';
      html += '</div>';

      document.getElementById('cfg-content').innerHTML = html;

      var debouncedPesoSum = debounce(updatePesoSum, 200);

      // Slider arrastado → espelha no campo numérico (o campo não está em edição aqui)
      var sliders = document.querySelectorAll('#cfg-content input[type=range]');
      sliders.forEach(function(sl) {
        sl.addEventListener('input', function() {
          var numInput = document.getElementById('num-'+sl.id);
          if (numInput) numInput.value = sl.value;
          debouncedPesoSum();
        });
      });

      document.querySelectorAll('#cfg-content .num-input').forEach(function(numInput) {
        var targetId = numInput.id.replace('num-', '');
        var slider = document.getElementById(targetId);
        var min = parseFloat(slider.min), max = parseFloat(slider.max);
        // Enquanto digita: só reflete no slider, SEM reescrever o campo — reescrever o
        // value a cada tecla reposicionava o cursor e clampava valores parciais (ex.: ao
        // digitar "12" num campo de min 5, o "1" virava 5), causando o "travamento".
        numInput.addEventListener('input', function() {
          var raw = parseFloat(numInput.value);
          if (!isNaN(raw)) { slider.value = Math.min(max, Math.max(min, raw)); debouncedPesoSum(); }
        });
        // Ao sair do campo (blur/Enter): normaliza e clampa o valor exibido de uma vez.
        numInput.addEventListener('change', function() {
          var val = Math.min(max, Math.max(min, parseFloat(numInput.value) || min));
          numInput.value = val;
          slider.value = val;
          updatePesoSum();
        });
      });

      document.querySelectorAll('#cfg-content .num-arrow').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var targetId = btn.getAttribute('data-target');
          var dir = parseInt(btn.getAttribute('data-dir'));
          var slider = document.getElementById(targetId);
          var numInput = document.getElementById('num-'+targetId);
          var min = parseFloat(slider.min), max = parseFloat(slider.max);
          // Incrementa pelo PASSO do slider (antes era +1 fixo: com step 5/10 o range
          // snapava para um valor diferente do campo, dessincronizando os dois).
          var step = parseFloat(slider.getAttribute('data-step')) || 1;
          var current = parseFloat(slider.value) || min;
          var novo = Math.min(max, Math.max(min, current + dir * step));
          slider.value = novo;
          if (numInput) numInput.value = novo;
          debouncedPesoSum();
        });
      });

      updatePesoSum();

      document.getElementById('btn-save-config').addEventListener('click', function() {
        var newConfig = {
          meta_prazo: parseInt(document.getElementById('meta_prazo').value),
          meta_rework: parseInt(document.getElementById('meta_rework').value),
          meta_leadtime: parseInt(document.getElementById('meta_leadtime').value),
          meta_leadtime_real: parseInt(document.getElementById('meta_leadtime_real').value),
          meta_through: parseInt(document.getElementById('meta_through').value),
          meta_conformidade: parseInt(document.getElementById('meta_conformidade').value),
          peso1: parseInt(document.getElementById('peso1').value),
          peso2: parseInt(document.getElementById('peso2').value),
          peso3: parseInt(document.getElementById('peso3').value),
          peso4: parseInt(document.getElementById('peso4').value),
          peso5: parseInt(document.getElementById('peso5').value),
          peso6: parseInt(document.getElementById('peso6').value),
          sla: {}
        };
        var sum = newConfig.peso1 + newConfig.peso2 + newConfig.peso3 + newConfig.peso4 + newConfig.peso5 + newConfig.peso6;
        if (sum !== 100) return;

        FLOW_LISTS.forEach(function(n, i) {
          if (n === 'Concluído 🏆') { newConfig.sla[n] = 999; return; }
          var input = document.getElementById('sla_'+i);
          newConfig.sla[n] = input ? parseInt(input.value) || DEFAULT_SLA[n] : DEFAULT_SLA[n];
        });

        t.set('board', 'shared', 'healthConfig', newConfig).then(function() {
          var msg = document.getElementById('cfg-msg');
          msg.textContent = 'Configurações salvas!';
          msg.style.display = '';
          if (cachedData) cachedData.config = newConfig;
          setTimeout(function() { switchTab('realtime'); loadRealtime(); }, 1000);
        });
      });
    }).catch(function(err) {
      // sem isto, uma falha do t.get deixava a aba de configurações em branco
      document.getElementById('cfg-content').innerHTML =
        '<div class="no-data"><p>Erro ao carregar as configurações: ' +
        escHtml(err && err.message ? err.message : String(err)) + '</p></div>';
    });
  }

  function sliderRow(id, label, value, min, max, step, unit) {
    // Sem o antigo span "slider-val": o número editável já mostra o valor, então o
    // texto duplicado foi removido. Mantém-se apenas a unidade (estática) como contexto.
    var unidade = (unit || '').trim();
    return '<div class="config-row">' +
      '<label for="'+id+'">'+label+'</label>' +
      '<div class="slider-row">' +
        '<input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+value+'" data-min="'+min+'" data-max="'+max+'" data-step="'+step+'">' +
        '<div class="num-input-wrap">' +
          '<button class="num-arrow" type="button" data-target="'+id+'" data-dir="-1">▼</button>' +
          '<input type="number" class="num-input" id="num-'+id+'" value="'+value+'" min="'+min+'" max="'+max+'" step="'+step+'">' +
          '<button class="num-arrow" type="button" data-target="'+id+'" data-dir="1">▲</button>' +
        '</div>' +
        (unidade ? '<span class="slider-unit">'+unidade+'</span>' : '') +
      '</div>' +
    '</div>';
  }

  function updatePesoSum() {
    var ids = ['peso1','peso2','peso3','peso4','peso5','peso6'];
    var sum = 0;
    ids.forEach(function(id) { sum += parseInt(document.getElementById(id).value) || 0; });
    var el = document.getElementById('peso-sum');
    var btn = document.getElementById('btn-save-config');
    el.textContent = 'Soma dos pesos: '+sum;
    if (sum === 100) { el.className = 'peso-sum valid'; btn.disabled = false; }
    else { el.className = 'peso-sum invalid'; el.textContent += ' (deve ser 100)'; btn.disabled = true; }
  }

  // Paineis Personalizados — ver js/custom-panels.js
  var CP = createCP({ calcKPIs: calcKPIs, calcPrimeiraEntrega: calcPrimeiraEntrega, loadRealtime: loadRealtime });

  // Ponte Trello -> MS Project — ver js/msproject.js
  var MSP = createMSP({ fetchData: fetchData, loadRealtime: loadRealtime, CP: CP });

  // ─── INIT ───────────────────────────────────────
  loadRealtime();
})();
</script>
</body>
</html>
