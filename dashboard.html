<!DOCTYPE html>
<html lang="pt-BR">

<body>

<script type="module">
import { TRELLO_TOKEN, apiUrl } from './js/trello-api.js';
import { FLOW_LISTS, PRODUCAO_ATIVA, ETAPAS_PRE_ENTREGA, NIVEIS_ESFORCO, PRIMEIRA_ENTREGA_EPOCH, DEFAULT_SLA, DEFAULTS, COR_NIVEL } from './js/config.js';
import { t, cachedData, setCachedData, renderedTabs, resetRenderedTabs } from './js/state.js';
import { debounce, round1, stdDev, mean, median, validarTitulo } from './js/core-util.js';
import { escHtml, fmtDateTime, fmtDateBR, fmtHoras, fmtDias, fmtPct } from './js/core-fmt.js';
import { countBusinessDays, elapsedCalendarDays, elapsedCalendarHours, countBusinessHours, idToDate, buildTimeline, isOverdue, sameMonth } from './js/core-time.js';
import { getConcludedAt, computeLeadTime, normalizeNivel, computePrimeiraEntrega } from './js/core-metrics.js';
import { downloadCSV, loadXLSXLib, loadHtml2Canvas, setBtnLoading, downloadCanvas } from './js/core-io.js';
import { createCP } from './js/custom-panels.js';
import { createMSP } from './js/msproject.js';

(function() {

  var CACHE_TTL = 300000;
  var FIELD_CACHE_TTL = 86400000;

  function getCacheKey(boardId) { return 'leadtime_cache_' + boardId; }

  function readCache(boardId) {
    try {
      var raw = localStorage.getItem(getCacheKey(boardId));
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (obj && obj.cachedAt && (Date.now() - obj.cachedAt < CACHE_TTL)) return obj;
    } catch(e) {}
    return null;
  }

  function writeCache(boardId, data) {
    try {
      data.cachedAt = Date.now();
      localStorage.setItem(getCacheKey(boardId), JSON.stringify(data));
    } catch(e) {}
  }

  function cacheAge(cachedAt) {
    var sec = Math.floor((Date.now() - cachedAt) / 1000);
    if (sec < 60) return sec + 's atrás';
    return Math.floor(sec / 60) + 'min atrás';
  }

  // ─── CACHE INCREMENTAL DE ACTIONS (por card) ────
  // As actions de um card só mudam quando há atividade nele — e QUALQUER atividade
  // atualiza dateLastActivity (que o fetch de cards já traz). Então: cacheia as
  // actions por card com o dateLastActivity da época; num load futuro, se o
  // dateLastActivity está idêntico, reutiliza sem re-buscar. Cards sem mudança
  // (inclusive TODOS os arquivados, imutáveis) deixam de gerar requisição.
  // Resultado byte-idêntico ao refetch: o cache só é usado com dateLastActivity igual.
  var ACTIONS_CACHE_VERSION = 1; // bump se o filtro/fields do fetch de actions mudar
  function actionsCacheKey(boardId) { return 'leadtime_actions_' + boardId; }
  function readActionsCache(boardId) {
    try {
      var raw = localStorage.getItem(actionsCacheKey(boardId));
      if (!raw) return {};
      var obj = JSON.parse(raw);
      if (obj && obj.v === ACTIONS_CACHE_VERSION && obj.cards) return obj.cards;
    } catch(e) {}
    return {};
  }
  function writeActionsCache(boardId, map) {
    try {
      localStorage.setItem(actionsCacheKey(boardId), JSON.stringify({ v: ACTIONS_CACHE_VERSION, cards: map }));
    } catch(e) {
      // quota excedida ou storage indisponível: descarta o cache (funciona sem ele)
      try { localStorage.removeItem(actionsCacheKey(boardId)); } catch(e2) {}
    }
  }

  function showSkeleton(msg) {
    var el = document.getElementById('rt-loading');
    el.innerHTML = '<div class="skeleton-wrap">' +
      '<div class="score-circle-wrap"><div class="skeleton skeleton-circle"></div></div>' +
      '<div class="skeleton-kpi-grid">' +
      '<div class="skeleton skeleton-card"></div>'.repeat(6) +
      '</div>' +
      '<p class="skeleton-status">' + (msg || 'Buscando cards do board…') + '</p>' +
      '</div>';
    el.style.display = '';
  }

  function updateSkeletonMsg(msg) {
    var p = document.querySelector('.skeleton-status');
    if (p) p.textContent = msg;
  }

  // ─── EXPORTAÇÃO: CARDS DE UMA ETAPA (XLSX, fallback CSV) ─
  // Reutiliza as funções de tempo (countBusinessDays/Hours, elapsed*) para que a
  // planilha seja idêntica ao que o dashboard calcula — sem lógica duplicada.
  function buildEtapaRows(nomeEtapa, cardsNaEtapa) {
    var now = new Date();
    var header = ['Título','Etapa atual','Entrada na etapa','Dias corridos','Dias úteis','Horas corridas','Horas úteis','Link'];
    var rows = cardsNaEtapa.map(function(c) {
      var ent = c.enteredCurrentAt ? new Date(c.enteredCurrentAt) : null;
      return {
        nome: c.name,
        etapa: c.currentListName,
        entrada: ent ? fmtDateTime(ent) : '—',
        diasCorr: ent ? elapsedCalendarDays(ent, now) : '',
        diasUteis: ent ? countBusinessDays(ent, now) : '',
        horasCorr: ent ? elapsedCalendarHours(ent, now) : '',
        horasUteis: ent ? countBusinessHours(ent, now) : '',
        link: c.url || ''
      };
    });
    return { header: header, rows: rows };
  }

  function exportEtapaCards(nomeEtapa, cardsNaEtapa, btn) {
    if (!cardsNaEtapa || !cardsNaEtapa.length) return;
    var data = buildEtapaRows(nomeEtapa, cardsNaEtapa);
    var safeName = nomeEtapa.replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '').toLowerCase();
    var fileBase = 'cards_' + (safeName || 'etapa');
    setBtnLoading(btn, true);

    loadXLSXLib(function(err) {
      try {
        if (err || typeof XLSX === 'undefined') { exportEtapaCSV(data, fileBase); return; }

        // ── Estilos executivos (mesma linguagem do relatório completo) ──
        var XB = { top:{style:'thin',color:{rgb:'DDDDDD'}}, bottom:{style:'thin',color:{rgb:'DDDDDD'}}, left:{style:'thin',color:{rgb:'DDDDDD'}}, right:{style:'thin',color:{rgb:'DDDDDD'}} };
        var head = {font:{bold:true,color:{rgb:'FFFFFF'},sz:11},fill:{fgColor:{rgb:'0A0A0A'}},border:XB,alignment:{horizontal:'center',vertical:'center',wrapText:true}};
        // alinhamento por coluna: texto à esquerda, data ao centro, números à direita
        var ALIGN = ['left','left','center','right','right','right','right','left'];
        var NUMFMT = { 3:'0.0', 4:'0', 5:'0.0', 6:'0.0' };
        function cellStyle(rowParity, col) {
          var s = { fill:{fgColor:{rgb: rowParity%2===0 ? 'FFFFFF' : 'F7F8F9'}}, border:XB, alignment:{horizontal:ALIGN[col]||'left',vertical:'center'} };
          if (NUMFMT[col]) s.numFmt = NUMFMT[col];
          return s;
        }

        var HEAD = 3;                         // faixa de título ocupa 3 linhas
        var aoa = [data.header];
        data.rows.forEach(function(r) {
          aoa.push([r.nome, r.etapa, r.entrada, r.diasCorr, r.diasUteis, r.horasCorr, r.horasUteis, r.link]);
        });
        var nCols = data.header.length;
        var ws = XLSX.utils.aoa_to_sheet([[]]);
        XLSX.utils.sheet_add_aoa(ws, aoa, { origin: { r: HEAD, c: 0 } });

        // faixa de título executivo (nome do relatório + metadados)
        ws['A1'] = { v:'Cards da etapa — ' + nomeEtapa, t:'s', s:{font:{bold:true,sz:15,color:{rgb:'0A0A0A'}},alignment:{vertical:'center'}} };
        ws['A2'] = { v:'Gerado em ' + fmtDateTime(new Date()) + ' · ' + data.rows.length + ' card' + (data.rows.length===1?'':'s'), t:'s', s:{font:{sz:10,color:{rgb:'6B6B70'}},alignment:{vertical:'center'}} };
        ws['!merges'] = [ {s:{r:0,c:0},e:{r:0,c:nCols-1}}, {s:{r:1,c:0},e:{r:1,c:nCols-1}} ];
        ws['!rows'] = [ {hpt:21}, {hpt:15}, {hpt:6} ];
        ws['!cols'] = [{wch:38},{wch:20},{wch:18},{wch:13},{wch:11},{wch:14},{wch:11},{wch:14}];

        // cabeçalho da tabela
        for (var c = 0; c < nCols; c++) ws[XLSX.utils.encode_cell({r:HEAD,c:c})].s = head;

        // linhas de dados: zebra + bordas + alinhamento/numFmt por tipo
        for (var i = 0; i < data.rows.length; i++) {
          var rr = HEAD + 1 + i;
          for (var cc = 0; cc < nCols; cc++) {
            var ref0 = XLSX.utils.encode_cell({r:rr,c:cc});
            if (!ws[ref0]) ws[ref0] = { v:'', t:'s' };
            ws[ref0].s = cellStyle(i, cc);
          }
          // coluna Link clicável (hyperlink nativo → Excel, Sheets, LibreOffice)
          var url = data.rows[i].link;
          if (url) {
            var lref = XLSX.utils.encode_cell({r:rr,c:7});
            ws[lref] = { t:'s', v:'Abrir card', l:{ Target:url, Tooltip:'Abrir no Trello' }, s:{font:{color:{rgb:'0B5FFF'},underline:true},border:XB,alignment:{vertical:'center'}} };
          }
        }

        var lastRow0 = HEAD + data.rows.length;
        ws['!ref'] = 'A1:' + XLSX.utils.encode_cell({r: lastRow0, c: nCols - 1});
        ws['!autofilter'] = { ref: XLSX.utils.encode_cell({r:HEAD,c:0}) + ':' + XLSX.utils.encode_cell({r:lastRow0,c:nCols-1}) };

        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Cards');
        XLSX.writeFile(wb, fileBase + '.xlsx');
      } catch (e) {
        exportEtapaCSV(data, fileBase); // qualquer erro → CSV garante a entrega
      } finally {
        setBtnLoading(btn, false);
      }
    });
  }

  function exportEtapaCSV(data, fileBase) {
    var rows = [data.header];
    data.rows.forEach(function(r) {
      // =HYPERLINK mantém o link clicável também no CSV (Excel/Google Sheets);
      // {raw} sinaliza ao downloadCSV que esta fórmula é intencional (não escapar).
      var link = r.link ? { raw: '=HYPERLINK("' + r.link + '";"Abrir card")' } : '';
      rows.push([r.nome, r.etapa, r.entrada, r.diasCorr, r.diasUteis, r.horasCorr, r.horasUteis, link]);
    });
    downloadCSV(fileBase + '.csv', rows);
  }

  // Definição única dos KPIs exibidos — usada pelo dashboard E pela imagem exportada
  // (evita duplicar nomes/metas/tipos em dois lugares).
  function buildKpiCards(kpis, config) {
    // `bucket` = campo de kpis com o subconjunto de cards; `bucketTitle` = título do modal.
    // (só usados pelo click-through no dashboard vivo; ignorados na imagem exportada.)
    // `scoreOverride` (só em "Cards vencidos"): quando presente, os consumidores devem
    // usar ESTE valor em vez de recalcular kpiHealth(valor,meta,tipo) — é como o score
    // já saiu de calcKPIs, com a exceção de noDueData aplicada (ver comentário lá).
    // `toggle` (só em "Retrabalhos"): sinaliza para o render exibir o controle Nº/%.
    // `pesoKey` = campo de config com o peso deste KPI no Health Score — usado só pelo
    // detalhamento "o que está pesando" (healthBreakdown), sem duplicar a lista de KPIs.
    return [
      { name: 'Cards vencidos', display: kpis.noDueData ? 'Sem dados' : kpis.kpi1+'%', metaLabel: 'Limite '+config.meta_prazo+'%', valor: kpis.kpi1, meta: config.meta_prazo, tipo: 'B', bucket: 'cardsVencidos', bucketTitle: 'Cards vencidos', scoreOverride: kpis.score_prazo, pesoKey: 'peso1' },
      { name: 'Retrabalhos',
        display: kpi2DisplayMode === 'taxa'
          ? fmtPct(kpis.totalCards ? (kpis.cardsComRetrabalho.length / kpis.totalCards * 100) : 0)
          : kpis.kpi2,
        metaLabel: 'Limite '+config.meta_rework, valor: kpis.kpi2, meta: config.meta_rework, tipo: 'B', bucket: 'cardsComRetrabalho', bucketTitle: 'Cards com retrabalho', toggle: true, pesoKey: 'peso2' },
      { name: 'Tempo médio de entrega', display: kpis.kpi6+' d.u.', metaLabel: 'Meta '+config.meta_leadtime_real+' d.u.', valor: kpis.kpi6, meta: config.meta_leadtime_real, tipo: 'B', bucket: 'cardsLeadTime', bucketTitle: 'Concluídos nos últimos 30 dias', pesoKey: 'peso6' },
      { name: 'Tempo médio na etapa', display: kpis.kpi3+' d.u.', metaLabel: 'Limite '+config.meta_leadtime+' d.u.', valor: kpis.kpi3, meta: config.meta_leadtime, tipo: 'B', bucket: 'cardsAging', bucketTitle: 'Cards em produção ativa', pesoKey: 'peso3' },
      { name: 'Vazão mensal', display: kpis.kpi4+' cards', metaLabel: 'Meta '+config.meta_through+' cards', valor: kpis.kpi4, meta: config.meta_through, tipo: 'A', bucket: 'cardsVazao', bucketTitle: 'Concluídos no mês', pesoKey: 'peso4' },
      { name: 'Conformidade', display: kpis.kpi5+'%', metaLabel: 'Meta '+config.meta_conformidade+'%', valor: kpis.kpi5, meta: config.meta_conformidade, tipo: 'A', bucket: 'cardsNaoConformes', bucketTitle: 'Cards não conformes', pesoKey: 'peso5' }
    ];
  }

  // Score de um card de buildKpiCards: usa o scoreOverride quando presente (kpi1),
  // senão recalcula por kpiHealth. Fonte ÚNICA — evita a mesma expressão duplicada
  // em 3 lugares (imagem exportada, render ao vivo, detalhamento do Health Score).
  function kpiCardScore(k) {
    return (k.scoreOverride !== undefined) ? k.scoreOverride : kpiHealth(k.valor, k.meta, k.tipo);
  }

  // ─── HEALTH SCORE: "O QUE ESTÁ PESANDO" ─────────
  // Deriva, para cada KPI, quantos PONTOS do Health Score ele está custando agora:
  //   perdidos = (100 - score) * peso / somaPesos
  // Isto é exatamente a mesma conta de calcKPIs' healthScore, só decomposta por termo —
  // a soma de todos os `perdidos` bate com (100 - healthScore). Não recalcula nenhum
  // score novo: reaproveita buildKpiCards (mesma fonte que os 6 cards visíveis).
  function healthBreakdown(kpis, config) {
    var somaPesos = config.peso1 + config.peso2 + config.peso3 + config.peso4 + config.peso5 + config.peso6;
    var itens = buildKpiCards(kpis, config).map(function(k) {
      var score = kpiCardScore(k);
      var peso = config[k.pesoKey] || 0;
      return {
        name: k.name, display: k.display, metaLabel: k.metaLabel, score: score,
        fatia: somaPesos > 0 ? round1(peso / somaPesos * 100) : 0,
        perdidos: somaPesos > 0 ? round1((100 - score) * peso / somaPesos) : 0,
        bucket: k.bucket, bucketTitle: k.bucketTitle,
        subCount: (kpis[k.bucket] || []).length
      };
    });
    itens.sort(function(a, b) { return b.perdidos - a.perdidos; });
    return itens;
  }

  function healthBreakdownBody(kpis, config) {
    var itens = healthBreakdown(kpis, config);
    var totalPerdido = round1(itens.reduce(function(s, it) { return s + it.perdidos; }, 0));
    var h = '<p class="hb-lead">Cada indicador entra no Health Score proporcionalmente ao peso ' +
      'configurado em "Configurar metas". Ordenado do que mais está <strong>custando pontos</strong> ' +
      'agora para o que menos custa — clique numa linha para ver os cards por trás dela.</p>';
    h += '<div class="hb-scroll"><table class="hb-table"><thead><tr>' +
      '<th>Indicador</th><th>Valor · meta</th><th>Score</th><th>Peso</th><th>Pontos perdidos</th>' +
      '</tr></thead><tbody>';
    itens.forEach(function(it) {
      var cor = statusColor(it.score);
      var clickable = it.subCount > 0;
      h += '<tr class="hb-row'+(clickable?' hb-clickable':'')+'"'+(clickable?' data-hb-bucket="'+escHtml(it.bucket)+'" tabindex="0" role="button" title="Ver os '+it.subCount+' card'+(it.subCount>1?'s':'')+'"':'')+'>';
      h += '<td class="hb-name"><span class="hb-dot" style="background:'+cor+'"></span>'+escHtml(it.name)+
        (clickable ? '<span class="hb-count">'+it.subCount+' card'+(it.subCount>1?'s':'')+' →</span>' : '')+'</td>';
      h += '<td class="hb-val">'+escHtml(String(it.display))+' <span class="hb-muted">/ '+escHtml(it.metaLabel)+'</span></td>';
      h += '<td class="hb-num"><span class="hb-pill" style="background:'+statusColorSoft(it.score)+';color:'+cor+'">'+Math.round(it.score)+'</span></td>';
      h += '<td class="hb-num hb-muted">'+String(it.fatia).replace('.',',')+'%</td>';
      h += '<td class="hb-num'+(it.perdidos>0.05?' hb-loss':' hb-muted')+'">'+(it.perdidos>0.05?'−'+String(it.perdidos).replace('.',','):'—')+'</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    var pior = itens[0];
    if (pior && pior.perdidos > 0.5) {
      h += '<div class="hb-callout"><strong>Foco recomendado:</strong> "'+escHtml(pior.name)+'" é quem mais ' +
        'está custando pontos agora ('+String(pior.perdidos).replace('.',',')+' de '+String(totalPerdido).replace('.',',')+' perdidos no total).</div>';
    } else {
      h += '<div class="hb-callout hb-callout-ok">Nenhum indicador está custando pontos relevantes — o Health Score está no seu potencial máximo com os dados atuais.</div>';
    }
    return { html: h, itens: itens };
  }

  // Abre o detalhamento reaproveitando o MESMO modal (CP.openModal) e o MESMO
  // componente de lista de cards (CP.openCards) já usados pela aba Análises
  // Personalizadas e pelo drill-down do Histórico (ver openHistChart) — modal
  // empilhado sobre modal é o padrão já estabelecido nesses dois lugares.
  function openHealthBreakdown(kpis, config) {
    if (typeof CP === 'undefined' || !CP || typeof CP.openModal !== 'function') return;
    var built = healthBreakdownBody(kpis, config);
    var over = CP.openModal({
      title: 'O que está pesando no Health Score',
      sub: 'Health Score atual: ' + kpis.healthScore + ' · ' + scoreStatus(kpis.healthScore),
      color: statusColor(kpis.healthScore),
      body: built.html
    });
    function openRow(row) {
      if (typeof CP.openCards !== 'function') return;
      var bucketKey = row.getAttribute('data-hb-bucket');
      var it = built.itens.filter(function(x) { return x.bucket === bucketKey; })[0];
      var sub = kpis[bucketKey] || [];
      if (it && sub.length) CP.openCards(it.bucketTitle, sub, statusColor(it.score));
    }
    over.addEventListener('click', function(e) {
      var row = e.target.closest('[data-hb-bucket]');
      if (row) openRow(row);
    });
    over.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var row = e.target.closest('[data-hb-bucket]');
      if (!row) return;
      e.preventDefault();
      openRow(row);
    });
  }

  // ─── EXPORTAÇÃO: SNAPSHOT VISUAL DO DASHBOARD ────
  // Monta um layout LIMPO e dedicado (fora de tela) a partir dos dados já carregados
  // (cachedData) e o captura — em vez de fotografar o DOM vivo (com botões, scroll,
  // tabelas). Resultado: imagem focada nos indicadores, sem poluição, e sem depender
  // de qual aba está ativa.
  function exportDashboardImage(data, btn) {
    if (!data) { alert('Acesse a aba "Tempo real" primeiro para carregar os dados.'); return; }
    setBtnLoading(btn, true);
    loadHtml2Canvas(function(err) {
      if (err || typeof html2canvas === 'undefined') {
        setBtnLoading(btn, false);
        alert('Não foi possível carregar o gerador de imagem.');
        return;
      }
      var kpis = calcKPIs(data.cards, data.config);
      var node = buildExportNode(kpis, data.config, data.cards.length);
      document.body.appendChild(node);
      html2canvas(node, { scale: 2, backgroundColor: '#F9F9F9', logging: false, useCORS: true })
        .then(function(canvas) { downloadCanvas(canvas, 'dashboard_midiatica'); })
        .catch(function() { alert('Falha ao gerar a imagem do dashboard.'); })
        .then(function() {
          if (node.parentNode) node.parentNode.removeChild(node); // limpa o DOM temporário
          setBtnLoading(btn, false);
        });
    });
  }

  function buildExportNode(kpis, config, totalCards) {
    var wrap = document.createElement('div');
    // fixo e fora da viewport: html2canvas renderiza pelo box do elemento, sem causar scroll

         '<div style="font-size:13px;color:#A2A2AA;margin-top:2px;">Dashboard de produção</div></div>';
    h += '<div style="font-size:13px;color:#A2A2AA;">'+agora+'</div></div>';
    // Health hero: número em tinta; a cor de estado fica na barra e no ponto de status
    h += '<div style="background:#FFFFFF;border:1px solid #E8E8EC;border-radius:14px;padding:24px 26px;margin-bottom:20px;">';
    h += '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;">' +
         '<div style="font-size:12px;font-weight:700;letter-spacing:0.08em;color:#75757F;text-transform:uppercase;">Health Score</div>' +
         '<div style="font-size:13px;font-weight:700;color:#55555E;">' +
         '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+hsCor+';margin-right:7px;"></span>' +
         scoreStatus(kpis.healthScore)+'</div></div>';
    h += '<div style="display:flex;align-items:center;gap:18px;">' +
         '<div style="font-size:54px;font-weight:800;line-height:1;color:#0A0A0A;letter-spacing:-0.02em;min-width:92px;">'+kpis.healthScore+'</div>' +
         '<div style="flex:1;height:12px;background:'+hsTrilha+';border-radius:999px;overflow:hidden;">' +
         '<div style="height:100%;width:'+kpis.healthScore+'%;background:'+hsCor+';border-radius:999px;"></div></div></div></div>';
    // Grid de KPIs 3x2
    h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px;">';
    buildKpiCards(kpis, config).forEach(function(k) {
      var pct = kpiBarPct(k.valor, k.meta);

      h += '<div style="background:#FFFFFF;border:1px solid #E8E8EC;border-radius:12px;padding:16px 18px;">' +
        '<div style="font-size:11px;font-weight:600;letter-spacing:0.06em;color:#75757F;text-transform:uppercase;margin-bottom:8px;min-height:28px;">'+k.name+'</div>' +
        '<div style="font-size:24px;font-weight:700;color:#0A0A0A;letter-spacing:-0.02em;">'+k.display+'</div>' +
        '<div style="font-size:11px;color:#75757F;margin-top:4px;">'+k.metaLabel+'</div>' +
        '<div style="height:6px;background:'+statusColorSoft(score)+';border-radius:999px;margin-top:14px;overflow:hidden;">' +
        '<div style="height:100%;width:'+pct+'%;background:'+cor+';border-radius:999px;"></div></div></div>';
    });
    h += '</div>';
    h += '<div style="font-size:12px;color:#75757F;text-align:right;">Gerado em '+agora+' · '+totalCards+' cards analisados</div>';
    wrap.innerHTML = h;
    return wrap;
  }

  function mergeConfig(cfg) {
    var config = {};
    Object.keys(DEFAULTS).forEach(function(k) { config[k] = DEFAULTS[k]; });
    if (cfg) {
      Object.keys(cfg).forEach(function(k) { config[k] = cfg[k]; });
      // Configs antigas (sem peso5 ou sem peso6) somavam 100 com menos pesos.
      // Ao introduzir um novo peso, recalibramos todos para os defaults balanceados,
      // evitando que a soma fique != 100 e quebre o Health Score.
      if (cfg.peso5 === undefined || cfg.peso6 === undefined) {
        config.peso1 = DEFAULTS.peso1; config.peso2 = DEFAULTS.peso2;
        config.peso3 = DEFAULTS.peso3; config.peso4 = DEFAULTS.peso4;
        config.peso5 = DEFAULTS.peso5; config.peso6 = DEFAULTS.peso6;
      }
      if (!cfg.sla) config.sla = DEFAULT_SLA;
    }
    return config;
  }

  // ─── TABS ───────────────────────────────────────
  var tabs = document.querySelectorAll('.tab');
  var tabContents = document.querySelectorAll('.tab-content');

    tabs.forEach(function(t){ t.classList.remove('active'); });
    tabContents.forEach(function(tc){ tc.classList.remove('visible'); });
    for (var i=0; i<tabs.length; i++) {
      if (tabs[i].getAttribute('data-tab') === name) tabs[i].classList.add('active');
    }
    setTimeout(function() {
      tabContents.forEach(function(tc){ tc.classList.remove('active'); });
      var target = document.getElementById('tab-'+name);
      target.classList.add('active');
      if (name === 'history' && !renderedTabs.history) { loadHistory(); renderedTabs.history = true; }
      if (name === 'config') renderConfig();
      if (name === 'funnel' && cachedData) { renderFunnel(); }
      else if (name === 'funnel' && !cachedData) { document.getElementById('funnel-content').innerHTML = '<div class="no-data"><p>Carregue os dados na aba "Tempo real" primeiro.</p></div>'; }
      if (name === 'custom') { CP.render(); }
      if (name === 'msproject') { MSP.render(); }
      requestAnimationFrame(function() { target.classList.add('visible'); });
    }, 150);
  }
  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() { switchTab(tab.getAttribute('data-tab')); });
  });

  // ─── POPUP DE ETAPA + DELEGAÇÃO GLOBAL DE CLIQUES ─
  // Registrados UMA única vez. Antes, renderRealtime/renderFunnel adicionavam
  // listeners aos contêineres permanentes (e ao document) a cada re-render,
  // acumulando handlers duplicados (t.showCard disparado N vezes por clique).
  // Reutiliza o mesmo modal de cards da aba "Análises Personalizadas" (CP.openCards)
  // em vez de um popup próprio — mesma aparência, animações e comportamento nas duas abas.

      return c.currentListName === nomeEtapa;
    });
